name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lambda-tests:
    name: Lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest moto[dynamodb] boto3
      - run: pytest lambda/tests/ -v -m "not live"

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
      - name: Validate stage1
        run: |
          terraform -chdir=infrastructure/stage1 init -backend=false
          terraform -chdir=infrastructure/stage1 validate
      - name: Validate stage2
        run: |
          terraform -chdir=infrastructure/stage2 init -backend=false
          terraform -chdir=infrastructure/stage2 validate
